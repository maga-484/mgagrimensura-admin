<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Panel de Administración — Agrimensura</title>
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
      crossorigin=""
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div id="app">
      <!-- LOGIN -->
      <section id="login-section" class="login-section">
        <div class="login-card">
          <h1>🔐 Panel de Administración</h1>
          <p>Ingresá tus credenciales para acceder.</p>
          <form id="login-form">
            <div class="form-row">
              <input
                type="text"
                id="login-usuario"
                placeholder="Usuario"
                required
              />
            </div>
            <div class="form-row">
              <input
                type="password"
                id="login-password"
                placeholder="Contraseña"
                required
              />
            </div>
            <button type="submit" class="btn-primario">Iniciar sesión</button>
          </form>
          <div id="login-error" class="mensaje-error oculto"></div>
        </div>
      </section>

      <!-- PANEL -->
      <section id="panel-section" class="panel-section oculto">
        <header class="panel-header">
          <h1>📋 Gestión de Parcelas</h1>
          <button id="btn-logout" class="btn-secundario">Cerrar sesión</button>
        </header>

        <div class="filtros">
          <label for="filtro-estado">Filtrar por estado:</label>
          <select id="filtro-estado">
            <option value="todos">Todos</option>
            <option value="recibido">Recibido</option>
            <option value="en proceso">En proceso</option>
            <option value="finalizado">Finalizado</option>
          </select>
          <button id="btn-refresh" class="btn-primario">🔄 Actualizar</button>
        </div>

        <div id="mensaje-global" class="mensaje-global oculto"></div>

        <div class="tabla-container">
          <table id="tabla-parcelas" class="tabla-parcelas">
            <thead>
              <tr>
                <th>ID</th>
                <th>Fecha</th>
                <th>Cliente</th>
                <th>Email</th>
                <th>Área (ha)</th>
                <th>Perímetro (m)</th>
                <th>Estado</th>
                <th>Acciones</th>
              </tr>
            </thead>
            <tbody id="tabla-body">
              <tr>
                <td colspan="8" class="celda-vacia">Cargando...</td>
              </tr>
            </tbody>
          </table>
        </div>

        <div id="mapa-wrapper" class="mapa-wrapper">
          <h3>🗺️ Vista de la Parcela</h3>
          <p class="mapa-hint">
            Hacé clic en una fila de la tabla para verla en el mapa.
          </p>
          <div id="mapa-parcela"></div>
          <div id="mapa-mensaje" class="mapa-mensaje oculto"></div>
        </div>
      </section>
    </div>

    <script
      src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
      integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
      crossorigin=""
    ></script>
    <script src="admin.js"></script>
  </body>
</html>
